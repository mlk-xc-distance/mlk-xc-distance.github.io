(function render(){
  const list = document.getElementById('recordsList');
  const sexToggle = document.getElementById('sexToggle');
  let currentSex = 'boys';

  function fmtDate(iso){
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  let selectedAlumnus = null;

  function fmtSeasonDate(dateStr, year){
    return `${dateStr}, ${year}`;
  }

  function timeToSeconds(t){
    const parts = t.split(':');
    return parts.length === 2 ? Number(parts[0]) * 60 + Number(parts[1]) : Number(t);
  }

  function isFiveK(meetName){
    return !/\b(4000m|4k|3200m|2\s*mile|3\s*mile)\b/i.test(meetName);
  }

  let selectedAlumniGender = 'boys';

  function renderAlumni(){
    if (ALUMNI.length === 0){
      list.innerHTML = `<div class="callout">No alumni added yet — check back once it's added.</div>`;
      return;
    }
    const sorted = [...ALUMNI].filter(a => a.gender === selectedAlumniGender).sort((a, b) => a.rank - b.rank);
    if (!selectedAlumnus || !sorted.some(a => a.name === selectedAlumnus)) selectedAlumnus = sorted[0].name;
    const athlete = sorted.find(a => a.name === selectedAlumnus);

    const genderTabs = `
      <div class="roster-filters" style="margin-bottom:14px;" role="group" aria-label="Filter alumni by team">
        <button type="button" data-alumni-gender="boys" class="${selectedAlumniGender === 'boys' ? 'active' : ''}" aria-pressed="${selectedAlumniGender === 'boys'}">Boys</button>
        <button type="button" data-alumni-gender="girls" class="${selectedAlumniGender === 'girls' ? 'active' : ''}" aria-pressed="${selectedAlumniGender === 'girls'}">Girls</button>
      </div>
    `;
    const options = sorted.map(a => `<option value="${a.name}" ${a.name === selectedAlumnus ? 'selected' : ''}>#${a.rank} — ${a.name}</option>`).join('');

    const recordsArr = athlete.gender === 'boys' ? BOYS_RECORDS : GIRLS_RECORDS;
    const recordEntry = recordsArr.find(r => `${r.first} ${r.last}` === athlete.name);
    const nameHeading = `<h3 class="link-subhead" style="font-size:16px; margin-bottom:10px;">${athlete.name}${recordEntry ? ` — Class of ${recordEntry.classYear}` : ''}</h3>`;

    let body;
    if (athlete.noData){
      body = nameHeading + `<div class="callout">No detailed XC race history on file for this athlete beyond their All-Time #${athlete.rank} entry. ${athlete.profile ? `<a href="${athlete.profile}" target="_blank" rel="noopener">View MileSplit profile →</a>` : ''}</div>`;
    } else {
      const prBox = athlete.pr ? `
        <div style="margin-bottom:16px;">
          <span class="pr-time-box" style="font-size:16px; padding:4px 10px;">${athlete.pr.time}<span class="pr-tag">HS PR</span></span>
          <span style="color:var(--slate); font-size:13px; margin-left:8px;">${athlete.pr.meet}${athlete.pr.place ? ` · ${athlete.pr.place}` : ''} · ${athlete.pr.date}</span>
        </div>
      ` : '';
      const seasonsHtml = athlete.seasons.map(s => {
        const fiveKTimes = s.races.filter(r => isFiveK(r.meet)).map(r => timeToSeconds(r.time));
        const seasonBestSec = fiveKTimes.length ? Math.min(...fiveKTimes) : null;
        return `
        <h4 class="link-subhead" style="margin-top:14px;">${s.year}${s.grade ? ` — ${s.grade}` : ''}</h4>
        <div class="results-table athlete-view">
          <div class="results-table-head"><div>Meet</div><div>Place</div><div>Time</div></div>
          ${s.races.map((r, i) => {
            const eligible = isFiveK(r.meet);
            const isPR = eligible && athlete.pr && r.time === athlete.pr.time;
            const isSB = eligible && !isPR && seasonBestSec !== null && timeToSeconds(r.time) === seasonBestSec;
            const badge = isPR ? 'PR' : (isSB ? 'SB' : null);
            return `
            <div class="results-table-row${i % 2 === 1 ? ' alt' : ''}${isPR ? ' is-pr' : ''}">
              <div class="rt-name">${r.link ? `<a href="${r.link}" target="_blank" rel="noopener" class="rt-name-link">${r.meet}</a>` : r.meet}<div class="rt-sub">${fmtSeasonDate(r.date, s.year)}</div></div>
              <div class="rt-place">${r.place || '—'}</div>
              <div class="rt-time">${badge === 'PR' ? `<span class="pr-time-box">${r.time}<span class="pr-tag">PR</span></span>` : badge === 'SB' ? `<span class="sb-time-box">${r.time}<span class="sb-tag">SB</span></span>` : r.time}</div>
            </div>
          `;
          }).join('')}
        </div>
      `;
      }).join('');
      body = nameHeading + prBox + seasonsHtml;
    }

    list.innerHTML = `
      <div class="link-card" style="display:block; cursor:default;">
        <div class="t" style="font-size:18px; margin-bottom:4px;">Alumni Careers</div>
        <div style="font-size:13px; color:var(--slate); margin-bottom:14px;">Full high school XC career, season by season. All-time rank shown next to each name.</div>
        ${genderTabs}
        <div style="margin-bottom:16px;">
          <select id="alumniSelect" class="athlete-select">${options}</select>
        </div>
        ${body}
      </div>
    `;
    document.getElementById('alumniSelect').addEventListener('change', (e) => {
      selectedAlumnus = e.target.value;
      renderAlumni();
    });
    list.querySelectorAll('[data-alumni-gender]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedAlumniGender = btn.dataset.alumniGender;
        selectedAlumnus = null;
        renderAlumni();
      });
    });
  }

  function render_list(){
    if (currentSex === 'alumni'){ renderAlumni(); return; }
    const records = currentSex === 'boys' ? BOYS_RECORDS : GIRLS_RECORDS;
    if (records.length === 0){
      list.innerHTML = `<div class="callout">No ${currentSex} all-time list yet — check back once it's added.</div>`;
      return;
    }
    list.innerHTML = `
      <div class="link-card" style="display:block; cursor:default;">
        <div class="results-table athlete-view">
          <div class="results-table-head">
            <div>Name</div><div>Rank</div><div>Time</div>
          </div>
          ${records.map((r, i) => `
            <div class="results-table-row${i % 2 === 1 ? ' alt' : ''}${r.rank === 1 ? ' is-pr' : ''}">
              <div class="rt-name">
                ${r.classYear >= 2027 ? `<a href="results.html?athlete=${encodeURIComponent(r.first + ' ' + r.last)}" class="rt-name-link">${r.first} ${r.last}</a>` : `<span class="rt-name-plain">${r.first} ${r.last}</span>`} <span class="season-badge">Class of ${r.classYear}</span>
                <div class="rt-sub">${r.meet} · ${r.grade} · ${fmtDate(r.date)}${r.location ? ` · ${r.location}` : ''}</div>
              </div>
              <div class="rt-place">${r.rank}</div>
              <div class="rt-time">${r.rank === 1 ? `<span class="pr-time-box">${r.time}<span class="pr-tag">#1</span></span>` : r.time}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  sexToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    sexToggle.querySelectorAll('button').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    currentSex = btn.dataset.sex;
    render_list();
  });

  const params = new URLSearchParams(window.location.search);
  const requestedAlumnus = params.get('alumni');
  const requestedAlumnusEntry = requestedAlumnus ? ALUMNI.find(a => a.name === requestedAlumnus) : null;
  if (requestedAlumnusEntry){
    currentSex = 'alumni';
    selectedAlumniGender = requestedAlumnusEntry.gender;
    selectedAlumnus = requestedAlumnusEntry.name;
    sexToggle.querySelectorAll('button').forEach(b => {
      const isAlumniBtn = b.dataset.sex === 'alumni';
      b.classList.toggle('active', isAlumniBtn);
      b.setAttribute('aria-pressed', String(isAlumniBtn));
    });
  }

  render_list();

  if (requestedAlumnusEntry){
    document.getElementById('recordsList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
